<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agua Cerca · Mapa</title>
<meta name="description" content="Cortes de agua, horas de servicio, puntos de abastecimiento, zonas inundables y aniegos recientes en Lima y Callao.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="mapa.css">
</head>
<body>
<header class="barra">
  <h1>Agua Cerca</h1>
  <nav><a href="./" aria-current="page">Mapa</a><a href="pasos.html">Pasos a desnivel</a><a href="costos.html">Costos</a></nav>
</header>
<main class="app">
  <form class="buscador" id="buscador" role="search">
    <input id="consulta" type="search" placeholder="Buscar dirección o lugar en Lima y Callao" autocomplete="off" aria-label="Buscar dirección o lugar">
    <button type="submit">Buscar</button>
    <button type="button" id="miUbicacion" title="Centrar en mi ubicación">Mi ubicación</button>
  </form>
  <div class="resultados" id="resultados" hidden></div>
  <div class="diseno">
    <div class="columna-mapa">
      <div id="mapa" role="region" aria-label="Mapa"></div>
      <div class="estado-mapa" id="estadoMapa" hidden></div>
    </div>
    <aside class="panel" id="panel">
      <details class="capas" open>
        <summary>Capas del mapa</summary>
        <div id="capas"></div>
      </details>
      <div class="pestanas" role="tablist" id="pestanas"></div>
      <section id="contenido" class="contenido" aria-live="polite"></section>
    </aside>
  </div>
  <p class="suave pequeno pie">Fuentes: Sunass (GeoSunass), MINAM, ANA, Defensoría y medios.
    Mapa © colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
    Información referencial: confirma con tu empresa de agua y sigue las indicaciones de las autoridades.</p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
