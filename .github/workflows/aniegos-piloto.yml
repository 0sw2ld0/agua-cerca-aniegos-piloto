name: Reportes recientes de aniegos
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: aniegos-feed
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Tests
        run: python3 -m unittest discover -s tools/aniegos/tests -v
      - name: Recopilar fuentes
        run: python3 tools/aniegos/generate.py --output resultado --rss-cache data/rss-vistos.json
      - name: Analizar evidencia nueva con Jev
        id: jev
        continue-on-error: true
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 tools/aniegos/jev_pilot.py --report resultado/report.json --output resultado-jev --private "$RUNNER_TEMP/jev-private" --state data/jev-state.json
      - name: Persistir respuestas y consumo, también ante fallos
        if: always()
        run: |
          if [ -f data/jev-state.json ]; then
            git add data/jev-state.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Guardar respuestas y consumo de Jev'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Reportes oficiales del COEN-INDECI
        continue-on-error: true
        timeout-minutes: 6
        run: |
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python3 tools/aniegos/indeci.py --output data/indeci.json --state data/indeci-estado.json
      - name: Generar archivo para la app
        run: python3 tools/aniegos/publish.py --report resultado/report.json --output data/aniegos.json --official data/indeci.json --places-cache data/lugares-osm.json
      - name: Escenarios de riesgo por lluvias (CENEPRED)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/aniegos/riesgo_lluvias.py --index data/riesgo-lluvias.json --folder data/riesgo-lluvias
      - name: Modo sombra GPT (no publica)
        id: gpt
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/aniegos/gpt_shadow.py --report resultado/report.json --state data/gpt-state.json --shadow data/gpt-sombra.json --places-cache data/lugares-osm.json --private "$RUNNER_TEMP/gpt-private" --output resultado-gpt
      - name: Publicar archivo actualizado
        run: |
          git add data/aniegos.json
          if [ -f data/lugares-osm.json ]; then git add data/lugares-osm.json; fi
          if [ -f data/rss-vistos.json ]; then git add data/rss-vistos.json; fi
          for f in data/indeci.json data/indeci-estado.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          for f in data/gpt-state.json data/gpt-sombra.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if [ -f data/riesgo-lluvias.json ]; then git add data/riesgo-lluvias.json; git add -A data/riesgo-lluvias; fi
          if [ -f data/jev-state.json ]; then git add data/jev-state.json; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar reportes recientes de aniegos'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Guardar resultados y fallos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aniegos-piloto
          path: |
            resultado/
            resultado-jev/
            resultado-gpt/
          if-no-files-found: warn
          retention-days: 7
      - name: Mostrar consumo y reutilización de Jev
        if: always()
        run: |
          if [ -f resultado-jev/RESUMEN.md ]; then cat resultado-jev/RESUMEN.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f resultado-gpt/RESUMEN.md ]; then cat resultado-gpt/RESUMEN.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Reiniciar el reloj si no está corriendo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          activos=$(gh run list --workflow reloj.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' || echo 1)
          if [ "$activos" = "0" ]; then gh workflow run reloj.yml --ref main && echo "Reloj reiniciado"; else echo "Reloj activo"; fi
      - name: Señalar fallos de Jev
        if: always() && steps.jev.outcome == 'failure'
        run: exit 1
